<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Salles Saint-Pierre | Location de salles à Pontarlier</title>
    <meta name="title" content="Salles Saint-Pierre | Location de salles à Pontarlier" />
    <meta name="description" content="Location de 3 salles de réception à Pontarlier. Idéales pour mariages, anniversaires, séminaires et événements. De 20 à 150 personnes. Disponibles toute l'année." />
    <meta name="keywords" content="location salle, Pontarlier, salle de réception, mariage, anniversaire, séminaire, Doubs, Franche-Comté" />
    <meta name="author" content=" Association des Groupements Catholiques de Pontarlier Saint Pierre" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="<%= siteUrl %>/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#f97316" />
    <meta name="msapplication-TileColor" content="#f97316" />

    <!-- Critical CSS for above-the-fold content -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#1c1917;color:#fafaf9}
      #root{min-height:100vh}
    </style>

    <!-- Preconnect to external services -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://maps.googleapis.com" />

    <!-- Favicon & Manifest -->
    <link rel="icon" href="<%= publicPath %>favicon.ico" sizes="48x48 96x96" />
    <link rel="icon" type="image/svg+xml" href="<%= publicPath %>favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="<%= publicPath %>apple-touch-icon.png" />
    <link rel="manifest" href="<%= publicPath %>manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="<%= siteUrl %>/" />
    <meta property="og:title" content="Salles Saint-Pierre | Location de salles à Pontarlier" />
    <meta property="og:description" content="Location de 3 salles de réception à Pontarlier. Idéales pour mariages, anniversaires, séminaires et événements. De 20 à 150 personnes." />
    <meta property="og:image" content="<%= siteUrl %>/og-image.jpg" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Salles Saint-Pierre Pontarlier" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="<%= siteUrl %>/" />
    <meta name="twitter:title" content="Salles Saint-Pierre | Location de salles à Pontarlier" />
    <meta name="twitter:description" content="Location de 3 salles de réception à Pontarlier. Idéales pour mariages, anniversaires, séminaires et événements. De 20 à 150 personnes." />
    <meta name="twitter:image" content="<%= siteUrl %>/og-image.jpg" />

    <!-- Structured Data - LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EventVenue",
      "name": "Salles Saint-Pierre - Pontarlier",
      "description": "Location de salles de réception à Pontarlier. Trois espaces modulables pour vos événements : mariages, anniversaires, séminaires.",
      "url": "<%= siteUrl %>",
      "telephone": "+33 7 65 53 03 57",
      "email": "locationstpierrepontarlier@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "7 Rue des Abbés Cattet",
        "addressLocality": "Pontarlier",
        "postalCode": "25300",
        "addressCountry": "FR"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 46.9070468,
        "longitude": 6.3516966
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "08:00",
        "closes": "23:00"
      },
      "priceRange": "80€ - 210",
      "currenciesAccepted": "EUR",
      "paymentAccepted": "Cash, Bank Transfer",
      "amenityFeature": [
        {"@type": "LocationFeatureSpecification", "name": "Cuisine équipée"},
        {"@type": "LocationFeatureSpecification", "name": "Tables et chaises"},
        {"@type": "LocationFeatureSpecification", "name": "Parking"}
      ],
      "maximumAttendeeCapacity": 150
    }
    </script>

    <!-- Structured Data - WebSite (controls site name in Google results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Salles Saint-Pierre Pontarlier",
      "alternateName": ["Salle Saint-Pierre Pontarlier", "Salles Saint-Pierre"],
      "url": "<%= siteUrl %>"
    }
    </script>

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Association des Groupements Catholiques de Pontarlier Saint Pierre",
      "url": "<%= siteUrl %>",
      "logo": "<%= siteUrl %>/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+33 7 65 53 03 57",
        "email": "locationstpierrepontarlier@gmail.com",
        "contactType": "reservations",
        "availableLanguage": "French"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "7 Rue des Abbés Cattet",
        "addressLocality": "Pontarlier",
        "postalCode": "25300",
        "addressCountry": "FR"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
